allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': false
  '@scarf/scarf': true
  cpu-features: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@eslint/plugin-kit@0.7.2'
  - eslint@10.4.1
  - ts-loader@9.6.0
onlyBuiltDependencies:
  - '@nestjs/core'
  - esbuild
overrides:
  qs: '>=6.16.0'
  multer: '>=2.3.0'
  serialize-javascript: '>=7.0.3'
  form-data: '>=4.0.6'
  # js-yaml ships in three lines here: the 5.x instance is prod (via
  # @nestjs/swagger, GHSA-pm4m-ph32-ghv5), the 4.x instance is dev-only
  # (@nestjs/cli > fork-ts-checker-webpack-plugin > cosmiconfig) and the 3.x
  # instance is dev-only (jest, GHSA-5p4m-2wfm-xmqj) and needs the 3.x API, so
  # patch each in place rather than collapsing them onto one major.
  # GHSA-2883-xcg3-v3hh (maxTotalMergeKeys does not bound CPU on empty merge
  # sources) is fixed in 3.15.2 and 4.3.2 respectively.
  js-yaml@>=5.0.0 <5.2.2: '>=5.2.2'
  js-yaml@>=4.0.0 <4.3.2: '>=4.3.2 <5.0.0'
  js-yaml@>=3.0.0 <3.15.2: '>=3.15.2 <4.0.0'
  minimatch@<3.1.4: 3.1.4
  minimatch@>=9.0.0 <9.0.7: 9.0.7
  minimatch@>=10.0.0 <10.2.3: 10.2.3
  ajv@<6.14.0: 6.14.0
  ajv@>=7.0.0-alpha.0 <8.18.0: 8.18.0
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0'
  formidable: '>=3.5.1'
  superagent: '>=9.0.2'
  # glob is selected and bounded like the minimatch/ajv/js-yaml lines above,
  # rather than applied to every consumer with no upper end. Measured on
  # 2026-09-12: seven packages depend on glob and five of them ask for 13 on
  # their own (@jest/reporters, jest-config, jest-runtime, test-exclude@8,
  # @nestjs/cli) — the selector takes the override off those five entirely.
  # Two still declare ^10 and are the whole reason the line exists:
  # archiver-utils@5 (dev, testcontainers -> archiver) and typeorm@0.3.31,
  # which resolves `entities` from a string glob via `glob.sync()` in
  # DirectoryExportedClassesLoader — i.e. on the production boot path, not in
  # a test run. Both land on the same 13.0.6 as before.
  # The upper end is the point: an unbounded `>=11.0.0` handed TypeORM every
  # future major sight-unseen, and no workflow in this repo runs a script that
  # would notice (see PAR-96, where exactly that shape cost `pnpm test:cov`
  # every instrumented file, silently). Raise the ceiling deliberately, after
  # checking that `glob.sync()` still means what it means today.
  # What the selector does NOT do, so nobody reads more safety into it than it
  # has: it fences a consumer only while that consumer keeps declaring a sub-11
  # range. If typeorm widened to `^10.5.0 || ^11.0.0`, the selector would stop
  # matching silently — no error, no lockfile line. That is not hypothetical:
  # typeorm 1.x drops the glob dependency altogether, so the day this repo
  # upgrades past 0.3.31, re-measure rather than assume. Whoever moves typeorm
  # checks who is left under this line; today it would be archiver-utils alone,
  # and archiver-utils is dev-only.
  glob@<11.0.0: '>=11.0.0 <14.0.0'
  # ...and test-exclude@6 is the one package in the tree that still reads glob as
  # a function: `promisify(require('glob'))` at index.js:5, which throws from
  # glob v9 on. It is dev-only (babel-plugin-istanbul -> @jest/transform), so
  # nothing noticed except `pnpm test:cov`, where every single file failed to
  # instrument and the report read `All files | 0 | 0 | 0 | 0`. v8 is the same
  # class with the two import lines rewritten, and it asks for glob ^13.0.6 and
  # minimatch ^10.2.2 by itself — so it needs neither of the lines above: the
  # glob selector no longer matches it at all, and its minimatch resolves to
  # 10.2.5 on its own, past that line's `<10.2.3` ceiling.
  # The target is bounded, like the glob line above. Mind the selector if this
  # line is ever re-cut: the consumer is babel-plugin-istanbul@8.0.0 and it
  # declares `^7.0.1` (measured 2026-09-12) — selecting on a remembered
  # `^6.0.0` would take the override off and return test:cov to all-zeros as
  # quietly as it went the first time. An unbounded `>=8.0.0` would be the
  # opposite mistake: a future major with no semver fence, and with no CI
  # running test:cov, just as quiet.
  test-exclude@<8.0.0: '>=8.0.0 <9.0.0'
  inflight: npm:lru-cache@11.0.2
  uuid: '>=14.0.0'
  brace-expansion: '>=5.0.9'
  # dev-only chains: undici via @testcontainers, fast-uri + browserslist via
  # @nestjs/cli (browserslist also reaches jest via @babel/core)
  undici: '>=8.9.0'
  fast-uri: '>=4.1.3'
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
