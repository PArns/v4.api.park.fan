allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  cpu-features: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@eslint/plugin-kit@0.7.2'
  - eslint@10.4.1
  - ts-loader@9.6.0
onlyBuiltDependencies:
  - '@nestjs/core'
  - esbuild
overrides:
  qs: '>=6.15.2'
  multer: '>=2.2.0'
  serialize-javascript: '>=7.0.3'
  form-data: '>=4.0.6'
  # Only the prod 4.x instance (via @nestjs/swagger); the 3.14.2 instance is
  # dev-only (jest/eslint) and needs the 3.x API, so leave it untouched.
  js-yaml@>=4.0.0 <4.1.2: '>=4.1.2'
  # Exponential parsing DoS in flow collections (GHSA-pm4m-ph32-ghv5); 5.x
  # consumers (@nestjs/swagger prod, cosmiconfig dev) take the patch bump.
  js-yaml@>=5.0.0 <5.2.2: '>=5.2.2'
  cosmiconfig>js-yaml: '>=5.2.2'
  minimatch@<3.1.4: 3.1.4
  minimatch@>=9.0.0 <9.0.7: 9.0.7
  minimatch@>=10.0.0 <10.2.3: 10.2.3
  ajv@<6.14.0: 6.14.0
  ajv@>=7.0.0-alpha.0 <8.18.0: 8.18.0
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0'
  formidable: '>=3.5.1'
  superagent: '>=9.0.2'
  glob: '>=11.0.0'
  inflight: npm:lru-cache@11.0.2
  uuid: '>=14.0.0'
  # Unbounded-expansion DoS / OOM crash (GHSA-mh99-v99m-4gvg); patched in 5.0.8.
  brace-expansion: '>=5.0.8'
