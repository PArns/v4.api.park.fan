allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': false
  '@scarf/scarf': true
  cpu-features: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@eslint/plugin-kit@0.7.2'
  - eslint@10.4.1
  - ts-loader@9.6.0
onlyBuiltDependencies:
  - '@nestjs/core'
  - esbuild
overrides:
  qs: '>=6.16.0'
  multer: '>=2.3.0'
  serialize-javascript: '>=7.0.3'
  form-data: '>=4.0.6'
  # js-yaml ships in three lines here: the 5.x instance is prod (via
  # @nestjs/swagger, GHSA-pm4m-ph32-ghv5), the 4.x instance is dev-only
  # (@nestjs/cli > fork-ts-checker-webpack-plugin > cosmiconfig) and the 3.x
  # instance is dev-only (jest, GHSA-5p4m-2wfm-xmqj) and needs the 3.x API, so
  # patch each in place rather than collapsing them onto one major.
  # GHSA-2883-xcg3-v3hh (maxTotalMergeKeys does not bound CPU on empty merge
  # sources) is fixed in 3.15.2 and 4.3.2 respectively.
  js-yaml@>=5.0.0 <5.2.2: '>=5.2.2'
  js-yaml@>=4.0.0 <4.3.2: '>=4.3.2 <5.0.0'
  js-yaml@>=3.0.0 <3.15.2: '>=3.15.2 <4.0.0'
  minimatch@<3.1.4: 3.1.4
  minimatch@>=9.0.0 <9.0.7: 9.0.7
  minimatch@>=10.0.0 <10.2.3: 10.2.3
  ajv@<6.14.0: 6.14.0
  ajv@>=7.0.0-alpha.0 <8.18.0: 8.18.0
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0'
  formidable: '>=3.5.1'
  superagent: '>=9.0.2'
  # glob is selected and bounded like the minimatch and ajv lines above, rather
  # than applied to every consumer with no upper end. Measured 2026-09-12:
  # seven packages depend on glob and five ask for 13 on their own
  # (@jest/reporters, jest-config, jest-runtime, test-exclude@8, @nestjs/cli),
  # so the selector takes the override off those five entirely. Two still
  # declare ^10 and are the reason the line exists: archiver-utils@5 (dev,
  # testcontainers -> archiver) and typeorm@0.3.31, which resolves `entities`
  # from a string pattern via `glob.sync()` in DirectoryExportedClassesLoader —
  # the production boot path, not a test run. Both land on 13.0.6 as before.
  # The upper end is the point. An unbounded `>=11.0.0` handed TypeORM every
  # future major sight-unseen, and no workflow in this repo runs a package.json
  # script that would notice (see PAR-96, where exactly that shape cost
  # `pnpm test:cov` every instrumented file, silently). Raising the ceiling is
  # a deliberate act with a check attached: that `glob.sync()` still means what
  # it means today.
  # Selector semantics, because it is easy to read more fence into this than it
  # has: pnpm matches by *intersection*, not containment, so the line keeps
  # catching a consumer whose range merely overlaps `<11.0.0` — a widened
  # `^10.5.0 || ^11.0.0` would still be caught. It stops applying once a range
  # clears 11 entirely. The `minimatch@>=10.0.0 <10.2.3` line above is the
  # worked example: test-exclude@8 declares `^10.2.2`, no subset of that range,
  # and lands on the pinned 10.2.3 — while eslint, out of the line's reach,
  # sits on 10.2.5.
  # typeorm 1.x drops the glob dependency altogether, so whoever upgrades past
  # 0.3.31 re-measures who is left under this line rather than assuming; today
  # that would be archiver-utils alone, and archiver-utils is dev-only.
  glob@<11.0.0: '>=11.0.0 <14.0.0'
  # ...and test-exclude@6 was the one package in the tree that read glob as a
  # function: `promisify(require('glob'))` at index.js:5, which throws from
  # glob v9 on. It is dev-only (babel-plugin-istanbul -> @jest/transform), so
  # nothing noticed except `pnpm test:cov`, where every single file failed to
  # instrument and the report read `All files | 0 | 0 | 0 | 0`. v8 is the same
  # class with the two import lines rewritten, and it asks for glob ^13.0.6 by
  # itself — so the glob selector above no longer matches it. It does still
  # take `minimatch@>=10.0.0 <10.2.3` above: it declares `^10.2.2`, which
  # intersects that range, so it lands on the pinned 10.2.3.
  # The target is bounded, like the glob line above. Mind the selector if this
  # line is ever re-cut: the consumer is babel-plugin-istanbul@8.0.0 and it
  # declares `^7.0.1` (measured 2026-09-12), not the `^6.0.0` this comment was
  # first written against. An unbounded `>=8.0.0` would be the opposite
  # mistake: a future major with no semver fence, and with no CI running
  # test:cov, just as quiet.
  # Whether this line is still load-bearing at all is a separate question and
  # deliberately not answered here (PAR-166): test-exclude@7.0.2 already reads
  # `const { glob } = require('glob')`, so the crash this override was cut for
  # may no longer exist below 8.
  test-exclude@<8.0.0: '>=8.0.0 <9.0.0'
  inflight: npm:lru-cache@11.0.2
  uuid: '>=14.0.0'
  brace-expansion: '>=5.0.9'
  # dev-only chains: undici via @testcontainers, fast-uri + browserslist via
  # @nestjs/cli (browserslist also reaches jest via @babel/core)
  undici: '>=8.9.0'
  fast-uri: '>=4.1.3'
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
