allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  cpu-features: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@eslint/plugin-kit@0.7.2'
  - eslint@10.4.1
  - ts-loader@9.6.0
onlyBuiltDependencies:
  - '@nestjs/core'
  - esbuild
overrides:
  qs: '>=6.15.2'
  multer: '>=2.2.0'
  serialize-javascript: '>=7.0.3'
  form-data: '>=4.0.6'
  # js-yaml ships in two lines here: the 5.x instance is prod (via
  # @nestjs/swagger, GHSA-pm4m-ph32-ghv5) and the 3.x instance is dev-only
  # (jest, GHSA-5p4m-2wfm-xmqj) and needs the 3.x API, so patch each in place.
  js-yaml@>=5.0.0 <5.2.2: '>=5.2.2'
  js-yaml@>=3.0.0 <3.15.1: '>=3.15.1 <4.0.0'
  minimatch@<3.1.4: 3.1.4
  minimatch@>=9.0.0 <9.0.7: 9.0.7
  minimatch@>=10.0.0 <10.2.3: 10.2.3
  ajv@<6.14.0: 6.14.0
  ajv@>=7.0.0-alpha.0 <8.18.0: 8.18.0
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0'
  formidable: '>=3.5.1'
  superagent: '>=9.0.2'
  glob: '>=11.0.0'
  inflight: npm:lru-cache@11.0.2
  uuid: '>=14.0.0'
  brace-expansion: '>=5.0.9'
  # dev-only chains: undici via @testcontainers, fast-uri via @nestjs/cli
  undici: '>=8.9.0'
  fast-uri: '>=3.1.5'
