allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': false
  '@scarf/scarf': true
  cpu-features: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@eslint/plugin-kit@0.7.2'
  - eslint@10.4.1
onlyBuiltDependencies:
  - '@nestjs/core'
  - esbuild
overrides:
  qs: '>=6.16.0'
  # @nestjs/platform-express@11.1.28 pins `multer: 2.2.0` exactly, so the floor
  # has to come from here. GHSA-3pph-fpjx-jg34 (an upload aborted before
  # diskStorage assigns a path leaves the file on disk with nothing to remove
  # it) is fixed in 2.4.0, which platform-express declares from 11.2.6 on —
  # whoever next moves NestJS can drop this line after checking that.
  multer: '>=2.4.0'
  # express@5.2.1 — the version platform-express pins — declares
  # `proxy-addr: ^2.0.7`, which already admits the patched 2.0.8, so this line
  # only holds the floor against a future re-resolve. GHSA-jqcg-44mw-7w3h: an
  # IPv4-mapped IPv6 trust subnet written with a short prefix compiles with
  # all-zero leading bits and matches every IPv4 address, so every client is
  # trusted at hop 0. This app sets `trust proxy` to `true` rather than a
  # subnet list (src/main.ts), so it never takes that path.
  proxy-addr: '>=2.0.8'
  serialize-javascript: '>=7.0.3'
  form-data: '>=4.0.6'
  # js-yaml ships in three lines here: the 5.x instance is prod (via
  # @nestjs/swagger, GHSA-pm4m-ph32-ghv5), the 4.x instance is dev-only
  # (@nestjs/cli > fork-ts-checker-webpack-plugin > cosmiconfig) and the 3.x
  # instance is dev-only (jest, GHSA-5p4m-2wfm-xmqj) and needs the 3.x API, so
  # patch each in place rather than collapsing them onto one major.
  # GHSA-2883-xcg3-v3hh (maxTotalMergeKeys does not bound CPU on empty merge
  # sources) is fixed in 3.15.2 and 4.3.2 respectively. Its 5.x counterpart
  # GHSA-r3ph-w7gj-g6xm is the same unbounded-merge report against the 5 line
  # and is fixed in 5.4.1, so the 5.x selector moves with it. Only `dump()` is
  # reached here (@nestjs/swagger serialises our own OpenAPI document for
  # /api-yaml); the advisory is in `load()`.
  js-yaml@>=5.0.0 <5.4.1: '>=5.4.1'
  js-yaml@>=4.0.0 <4.3.2: '>=4.3.2 <5.0.0'
  js-yaml@>=3.0.0 <3.15.2: '>=3.15.2 <4.0.0'
  minimatch@<3.1.4: 3.1.4
  minimatch@>=9.0.0 <9.0.7: 9.0.7
  minimatch@>=10.0.0 <10.2.3: 10.2.3
  ajv@<6.14.0: 6.14.0
  ajv@>=7.0.0-alpha.0 <8.18.0: 8.18.0
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0'
  formidable: '>=3.5.1'
  superagent: '>=9.0.2'
  # glob is selected and bounded like the minimatch and ajv lines above, rather
  # than applied to every consumer with no upper end. Measured 2026-09-12:
  # seven packages depend on glob and four ask for 13 on their own
  # (@jest/reporters, jest-config, jest-runtime, @nestjs/cli), so the selector
  # takes the override off those four entirely. Three still declare ^10 and are
  # the reason the line exists: archiver-utils@5 (dev, testcontainers ->
  # archiver), test-exclude@7.0.2 (dev, babel-plugin-istanbul@8.0.0 -> jest
  # coverage; measured 2026-10-12 to run on glob 13.0.6, 316 instrumented files
  # in `pnpm test:cov`) and typeorm@0.3.31, which resolves `entities`
  # from a string pattern via `glob.sync()` in DirectoryExportedClassesLoader —
  # the production boot path, not a test run. Both land on 13.0.6 as before.
  # The upper end is the point. An unbounded `>=11.0.0` handed TypeORM every
  # future major sight-unseen, and no workflow in this repo runs a package.json
  # script that would notice (see PAR-96, where exactly that shape cost
  # `pnpm test:cov` every instrumented file, silently). Raising the ceiling is
  # a deliberate act with a check attached: that `glob.sync()` still means what
  # it means today.
  # Selector semantics, because it is easy to read more fence into this than it
  # has: pnpm matches by *intersection*, not containment, so the line keeps
  # catching a consumer whose range merely overlaps `<11.0.0` — a widened
  # `^10.5.0 || ^11.0.0` would still be caught. It stops applying once a range
  # clears 11 entirely. The `minimatch@>=10.0.0 <10.2.3` line above is the
  # worked example: test-exclude declares `^10.2.2`, no subset of that range,
  # and lands on the pinned 10.2.3 — while eslint, out of the line's reach,
  # sits on 10.2.5. test-exclude@7.0.2 declares the same `^10.2.2`.
  # typeorm 1.x drops the glob dependency altogether, so whoever upgrades past
  # 0.3.31 re-measures who is left under this line rather than assuming; today
  # that would be archiver-utils alone, and archiver-utils is dev-only.
  glob@<11.0.0: '>=11.0.0 <14.0.0'
  inflight: npm:lru-cache@11.0.2
  uuid: '>=14.0.0'
  # brace-expansion reaches the production boot path: typeorm resolves
  # `entities: [__dirname + "/../**/*.entity{.ts,.js}"]`
  # (src/config/typeorm.config.ts) through glob > minimatch. Three advisories
  # land above the previous 5.0.9 floor — GHSA-6j4f-fj2g-mc7p and
  # GHSA-qhr7-859c-m2p7 (stack exhaustion through recursion in
  # parseCommaParts and on nested brace groups, fixed in 5.0.10 and 5.0.11)
  # and GHSA-q2hr-2g5m-vwhr (quadratic `{a},b}` rewrite, 5.0.12) — so the
  # floor goes to the highest of the three. All three need an adversarial
  # pattern string; the only pattern reaching it here is the literal above.
  brace-expansion: '>=5.0.12'
  # dev-only chains: undici via @testcontainers, fast-uri + browserslist via
  # @nestjs/cli (browserslist also reaches jest via @babel/core)
  # undici's floor tracks what testcontainers@12.2.0 now declares for itself
  # (^8.10.2, the fix for the GHSA-vp8m-p9jh-q5pm batch); fast-uri clears
  # GHSA-jvvf-x445-j334 + GHSA-hrr3-gc8f-f4qj (inconsistent host case, mailto
  # injection) in 4.1.5.
  undici: '>=8.10.2'
  fast-uri: '>=4.1.5'
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
