[pytest]
# `test_resampling.py` is a benchmarking SCRIPT that happens to be named like a
# test module: it has no test functions and calls fetch_training_data() at
# import time, so pytest aborts collection with an OperationalError wherever no
# database is reachable — and where one is, it would pull seven days of
# production training data before the first real test ran. Run it by hand
# (`python test_resampling.py`) when comparing resampling intervals.
addopts = --ignore=test_resampling.py
